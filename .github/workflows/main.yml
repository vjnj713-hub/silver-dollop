name: BlazePC RDP (No Discord)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"  # Every 6 hours

jobs:
  blaze-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      TS_HOSTNAME: BlazePC
      RDP_USER: BlazePC

    steps:
      - name: Configure Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" || $true
          netsh advfirewall firewall add rule name="RDP-Playit" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create/Update BlazePC User
        run: |
          $user = "$env:RDP_USER"
          $pwdPlain = "${{ secrets.RDP_PASSWORD }}"
          if (-not $pwdPlain -or $pwdPlain -eq "") { exit 1 }
          $securePass = ConvertTo-SecureString $pwdPlain -AsPlainText -Force

          if (Get-LocalUser -Name $user -ErrorAction SilentlyContinue) {
              $u = [ADSI]"WinNT://./$user,user"
              $u.SetPassword($pwdPlain)
          } else {
              New-LocalUser -Name $user -Password $securePass -AccountNeverExpires -PasswordNeverExpires
          }

          Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue
          echo "RDP_PASS=$pwdPlain" >> $env:GITHUB_ENV

      - name: Install Playit Agent
        run: |
          # Prefer a repo secret for the claim token. Fallback to the token you provided.
          $claimToken = "${{ secrets.PLAYIT_CLAIM }}" 
          if (-not $claimToken -or $claimToken -eq "") { $claimToken = "/688798ujjgf" }

          # Download Playit agent binary (best-effort URL — if Playit changes this URL, update it to the official download link).
          $agentUrl = "https://playit.gg/downloads/playit-agent/windows/amd64/playit-agent.exe"
          $agentPath = Join-Path $env:TEMP "playit-agent.exe"

          Write-Host "Downloading Playit agent from $agentUrl"
          try {
              Invoke-WebRequest -Uri $agentUrl -OutFile $agentPath -UseBasicParsing -ErrorAction Stop
          } catch {
              Write-Host "Download failed. Please update agentUrl to the correct Playit download URL."
              exit 1
          }

          # Make executable (on Windows it's already executable). Place in Program Files for system-wide use.
          $dest = Join-Path $env:ProgramFiles "Playit"
          New-Item -Path $dest -ItemType Directory -Force | Out-Null
          Copy-Item -Path $agentPath -Destination (Join-Path $dest "playit-agent.exe") -Force
          Remove-Item $agentPath -Force
          echo "PLAYIT_AGENT_PATH=$dest\playit-agent.exe" >> $env:GITHUB_ENV

      - name: Claim + Start Playit Agent (foreground briefly to capture info, then background)
        shell: powershell
        run: |
          $exe = $env:PLAYIT_AGENT_PATH
          if (-not (Test-Path $exe)) {
              Write-Host "Playit agent not found at $exe"
              exit 1
          }

          # Use claim token from secrets if present, otherwise fallback token (the token you provided).
          $claimToken = "${{ secrets.PLAYIT_CLAIM }}"
          if (-not $claimToken -or $claimToken -eq "") { $claimToken = "/688798ujjgf" }

          Write-Host "Claiming Playit agent with provided token..."
          # Best-effort claim command. If Playit uses a different CLI syntax, adjust accordingly.
          & $exe claim $claimToken 2>&1 | Tee-Object -Variable claimOutput
          $claimOutText = ($claimOutput -join "`n")
          Write-Host "Claim output:`n$claimOutText"

          # Save claim output into env for later steps (may include the public endpoint or instructions).
          $sanitized = $claimOutText -replace "`n","; "
          echo "PLAYIT_CLAIM_OUTPUT=$sanitized" >> $env:GITHUB_ENV

          # Start agent as a background job so it keeps running for the Keep Alive step.
          Write-Host "Starting Playit agent as background process..."
          Start-Process -FilePath $exe -ArgumentList "run" -WindowStyle Hidden

      - name: Gather System Info
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $mem = Get-CimInstance Win32_ComputerSystem
          $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'"
          $uptime = (Get-Date) - $os.LastBootUpTime

          $sys = @{
              OS=$os.Caption
              Version=$os.Version
              Uptime=$uptime.ToString()
              CPU=$cpu.Name
              CPU_Cores=$cpu.NumberOfCores
              CPU_Logical=$cpu.NumberOfLogicalProcessors
              RAM_TotalMB=[math]::Round($mem.TotalPhysicalMemory/1MB,2)
              RAM_FreeMB=[math]::Round((Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory/1024,2)
              Disk_SizeGB=[math]::Round($disk.Size/1GB,2)
              Disk_FreeGB=[math]::Round($disk.FreeSpace/1GB,2)
          }

          $json = $sys | ConvertTo-Json -Compress
          echo "SYS_INFO=$json" >> $env:GITHUB_ENV
          Write-Host "System info collected."

      - name: Verify RDP Port (local test)
        run: |
          # We can test local port 3389 (RDP). If Playit provides an external endpoint in the claim output,
          # it's saved as PLAYIT_CLAIM_OUTPUT and can be inspected in logs.
          $test = Test-NetConnection -ComputerName "127.0.0.1" -Port 3389 -WarningAction SilentlyContinue
          echo "RDP_REACHABLE=$($test.TcpTestSucceeded)" >> $env:GITHUB_ENV
          Write-Host "RDP reachable locally: $($test.TcpTestSucceeded)"

      - name: Keep BlazePC RDP Active
        run: |
          Write-Host "`n=== BlazePC RDP DETAILS ==="
          Write-Host "Hostname: $env:TS_HOSTNAME"
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Password: $env:RDP_PASS"
          Write-Host "System Info JSON: $env:SYS_INFO"
          Write-Host "Playit claim output: $env:PLAYIT_CLAIM_OUTPUT"
          Write-Host "============================`n"
          while ($true) {
              Write-Host "[$(Get-Date)] BlazePC RDP running..."
              Start-Sleep -Seconds 300
          }
