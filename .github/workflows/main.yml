name: BlazePC RDP (Playit.gg)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"  # auto rerun every 6 hours

jobs:
  blaze-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_USER: BlazePC

    steps:
      - name: Enable Remote Desktop
        run: |
          Write-Host "🔧 Enabling RDP access..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force
          Write-Host "✅ RDP enabled successfully!"

      - name: Create BlazePC User
        run: |
          $user = "$env:RDP_USER"
          $pwdPlain = "${{ secrets.RDP_PASSWORD }}"
          if (-not $pwdPlain -or $pwdPlain -eq "") {
            Write-Error "❌ Missing RDP_PASSWORD secret!"
            exit 1
          }
          $secure = ConvertTo-SecureString $pwdPlain -AsPlainText -Force
          if (Get-LocalUser -Name $user -ErrorAction SilentlyContinue) {
            Write-Host "🔁 Updating existing BlazePC user password..."
            $u = [ADSI]"WinNT://./$user,user"
            $u.SetPassword($pwdPlain)
          } else {
            Write-Host "👤 Creating BlazePC user..."
            New-LocalUser -Name $user -Password $secure -AccountNeverExpires -PasswordNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue
          Write-Host "✅ BlazePC user ready!"

      - name: Download Playit.gg Agent
        run: |
          Write-Host "⬇️ Fetching latest Playit.gg Windows agent..."
          $api = "https://api.github.com/repos/playit-cloud/playit-agent/releases/latest"
          $response = Invoke-RestMethod -Uri $api
          $asset = $response.assets | Where-Object { $_.name -like "*win_64-setup.exe" } | Select-Object -First 1
          $path = "$env:TEMP\playit.exe"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $path
          Write-Host "✅ Playit agent downloaded to $path"
          echo "PLAYIT_PATH=$path" >> $env:GITHUB_ENV

      - name: Run Playit.gg Agent
        run: |
          Write-Host "🚀 Starting Playit.gg Agent..."
          $exe = "$env:PLAYIT_PATH"
          Start-Process -FilePath $exe -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 10

          # Try to launch Playit agent (background)
          $agentPath = "C:\Program Files\playit\playit.exe"
          if (Test-Path $agentPath) {
            Start-Process -FilePath $agentPath
            Write-Host "✅ Playit agent launched!"
          } else {
            Write-Host "⚠️ Playit agent not found in Program Files, check $exe path manually"
          }

          Write-Host "`n🔗 Now open your Playit dashboard:"
          Write-Host "👉 https://playit.gg/account/tunnels"
          Write-Host "Create a TCP tunnel: 127.0.0.1:3389 → Get your public IP:PORT"
          Write-Host "Then use RDP to connect using details below."
          Write-Host "============================================"

      - name: Show System Info
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $ram = [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 2)
          Write-Host "🖥️  OS: $($os.Caption)"
          Write-Host "⚙️  CPU: $($cpu.Name)"
          Write-Host "💾 RAM: ${ram}GB"
          Write-Host "============================================"

      - name: Keep RDP Session Alive
        run: |
          Write-Host "`n✅ BlazePC RDP ready!"
          Write-Host "Username: BlazePC"
          Write-Host "Password: ${{ secrets.RDP_PASSWORD }}"
          Write-Host "Open your Playit dashboard for public IP & port:"
          Write-Host "👉 https://playit.gg/account/tunnels"
          Write-Host "============================================"
          while ($true) {
              Write-Host "[$(Get-Date)] BlazePC RDP running..."
              Start-Sleep -Seconds 300
          }
