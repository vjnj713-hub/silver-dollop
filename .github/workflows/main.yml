name: BlazePC RDP (Playit.gg - Robust Download)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"  # auto rerun every 6 hours

jobs:
  blaze-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_USER: BlazePC

    steps:
      - name: Enable Remote Desktop
        shell: pwsh
        run: |
          Write-Host "🔧 Enabling RDP access..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          # Allow Remote Desktop firewall rules (try both ways)
          try { Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction Stop } catch { Write-Host "Enable-NetFirewallRule failed (may not exist)"; }
          netsh advfirewall firewall delete rule name="RDP" | Out-Null
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force
          Write-Host "✅ RDP enabled successfully!"

      - name: Create BlazePC User (from secret)
        shell: pwsh
        run: |
          $user = "$env:RDP_USER"
          $pwdPlain = "${{ secrets.RDP_PASSWORD }}"
          if (-not $pwdPlain -or $pwdPlain -eq "") {
            Write-Error "Missing RDP_PASSWORD secret. Set repo secret RDP_PASSWORD and retry."
            exit 1
          }
          $secure = ConvertTo-SecureString $pwdPlain -AsPlainText -Force
          if (Get-LocalUser -Name $user -ErrorAction SilentlyContinue) {
            Write-Host "🔁 Updating existing BlazePC user password..."
            $u = [ADSI]"WinNT://./$user,user"
            $u.SetPassword($pwdPlain)
          } else {
            Write-Host "👤 Creating BlazePC user..."
            New-LocalUser -Name $user -Password $secure -AccountNeverExpires -PasswordNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue
          echo "RDP_PASS=$pwdPlain" >> $env:GITHUB_ENV
          Write-Host "✅ BlazePC user ready!"

      - name: Download Playit.gg Agent (robust)
        shell: pwsh
        run: |
          Write-Host "⬇️ Fetching latest Playit.gg Windows agent metadata..."
          $api = "https://api.github.com/repos/playit-cloud/playit-agent/releases/latest"
          try {
            $response = Invoke-RestMethod -Uri $api -ErrorAction Stop
          } catch {
            Write-Error "Failed to call GitHub API for playit-agent releases: $_"
            exit 1
          }

          # pick first .exe asset (robust if naming changed)
          $asset = $response.assets | Where-Object { $_.name -match '\.exe$' } | Select-Object -First 1
          if ($null -eq $asset) {
            Write-Error "No .exe asset found in the latest playit-agent release."
            exit 1
          }

          $path = "$env:TEMP\playit.exe"
          Write-Host "⬇️ Downloading $($asset.name) ..."
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $path -UseBasicParsing -ErrorAction Stop
          Write-Host "✅ Playit agent downloaded to $path"
          echo "PLAYIT_PATH=$path" >> $env:GITHUB_ENV

      - name: Install & Launch Playit Agent
        shell: pwsh
        run: |
          $exe = "$env:PLAYIT_PATH"
          if (-not (Test-Path $exe)) {
            Write-Error "Playit installer not found at $exe"
            exit 1
          }

          Write-Host "🛠 Installing Playit agent silently..."
          # silent install; some installers may ignore /S - adjust if needed
          Start-Process -FilePath $exe -ArgumentList "/S" -Wait -NoNewWindow
          Start-Sleep -Seconds 5

          $possiblePaths = @(
            "C:\Program Files\playit\playit.exe",
            "C:\Program Files (x86)\playit\playit.exe"
          )
          $agentPath = $possiblePaths | Where-Object { Test-Path $_ } | Select-Object -First 1

          if ($null -ne $agentPath) {
            Write-Host "🚀 Launching Playit agent from $agentPath"
            Start-Process -FilePath $agentPath
            Start-Sleep -Seconds 8
            Write-Host "✅ Playit agent started (may require you to authorize tunnels via playit.gg dashboard)."
          } else {
            Write-Warning "Playit agent executable not found in Program Files. You can run the installer manually from $exe on the runner."
          }

          Write-Host ""
          Write-Host "🔗 Now open your Playit dashboard to create/authorize the tunnel:"
          Write-Host "👉 https://playit.gg/account/tunnels"
          Write-Host "Create a TCP tunnel mapping 127.0.0.1:3389 → public host:port"
          Write-Host ""

      - name: Show System Info & Usage
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $ramGB = [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 2)
          Write-Host "🖥️  OS: $($os.Caption) (Build $($os.BuildNumber))"
          Write-Host "⚙️  CPU: $($cpu.Name) — Cores: $($cpu.NumberOfCores), Logical: $($cpu.NumberOfLogicalProcessors)"
          Write-Host "💾 RAM: ${ramGB}GB"
          Write-Host "============================================"
          Write-Host "When tunnel is created/authorized, you will see Public host:port in the Playit dashboard."
          Write-Host "Use that host:port in your RDP client."
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Password: $env:RDP_PASS"
          Write-Host "============================================"

      - name: Keep RDP Session Alive
        shell: pwsh
        run: |
          Write-Host "`n✅ BlazePC RDP ready (runner will keep alive until job ends)."
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Password: $env:RDP_PASS"
          Write-Host "Open https://playit.gg/account/tunnels to view the public host:port for your tunnel."
          Write-Host "Note: This runner is ephemeral — Playit public host:port will remain valid only while this runner/session is active."
          while ($true) {
            Write-Host "[$(Get-Date)] BlazePC RDP running..."
            Start-Sleep -Seconds 300
          }
